name: amtgard-denarius

services:
  denariusapp:
    image: amtgard-denarius-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "41193:9003"
    volumes:
      - .:/var/www/denarius.amtgard.com
      - ${DENARIUS_HEV_WEB_SECRETS:-./.local/empty-secrets}:/run/secrets:ro
      - ${DENARIUS_HEV_CONNECT_SECRETS:-./.local/empty-secrets}:/run/secrets-connect:ro
      - ${HOST_ENV_VAULT_RUNTIME_DIR:-./.local/empty-runtime}:/run/host-env-vault:ro
    env_file:
      - .env
    environment:
      - ENVIRONMENT=DEV
      - XDEBUG_MODE=off
      - HOST_ENV_SECRETS_DIR=/run/secrets
      - DENARIUS_HEV_CONNECT_SECRETS=/run/secrets-connect
      - HOST_ENV_VAULT_RUNTIME_DIR=/run/host-env-vault
      - DENARIUS_HEV_CONNECT_PROFILE=denarius-connect
    networks:
      - amtgard-denarius-net
      - amtgard-denarius-shared
    container_name: amtgard-denarius
    hostname: amtgard-denarius
    depends_on:
      - amtgarddenariusdb

  test:
    profiles: ["test"]
    image: amtgard-denarius-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    working_dir: /var/www/denarius.amtgard.com
    volumes:
      - .:/var/www/denarius.amtgard.com
    env_file:
      - .env
    environment:
      - ENVIRONMENT=DEV
      - XDEBUG_MODE=off
    entrypoint: ["bash", "-lc"]
    command: ["composer test"]
    depends_on:
      - amtgarddenariusdb
    networks:
      - amtgard-denarius-net

  amtgarddenariusdb:
    image: mariadb:11
    restart: always
    environment:
      MARIADB_DATABASE: denarius
      MARIADB_USER: denarius
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "36316:3306"
    volumes:
      - data-db:/var/lib/mysql
      - ./mariadb-init:/docker-entrypoint-initdb.d:ro
    container_name: amtgard-denarius-db
    hostname: amtgard-denarius-db
    networks:
      - amtgard-denarius-net

volumes:
  data-db:
    name: amtgard-denarius_data-db

networks:
  amtgard-denarius-net:
    name: amtgard-denarius-net
  amtgard-denarius-shared:
    name: amtgard-denarius-shared
    external: true
