x-denarius-docker-logging: &denarius-docker-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "3"

services:
  ledger-worker:
    logging: *denarius-docker-logging
    image: amtgard-denarius-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    volumes:
      - .:/var/www/denarius.amtgard.com
      - ${DENARIUS_HEV_WORKER_SECRETS:-./.local/empty-secrets}:/run/secrets:ro
      - ${DENARIUS_HOST_LOG_DIR:-/var/log/amtgard-denarius}/dev-worker:/var/www/denarius.amtgard.com/logs
    env_file:
      - .env
    environment:
      - HOST_ENV_SECRETS_DIR=/run/secrets
      - ENVIRONMENT=DEV
      - XDEBUG_MODE=off
    command:
      - php
      - -d
      - xdebug.mode=off
      - -d
      - memory_limit=256M
      - /var/www/denarius.amtgard.com/bin/ledger-worker.php
    networks:
      - amtgard-denarius-shared
      - amtgard-denarius-net

networks:
  amtgard-denarius-shared:
    name: amtgard-denarius-shared
    external: true
  amtgard-denarius-net:
    name: amtgard-denarius-net
    external: true
