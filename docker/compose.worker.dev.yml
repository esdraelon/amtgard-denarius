services:
  ledger-worker:
    image: amtgard-denarius-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    volumes:
      - .:/var/www/denarius.amtgard.com
    env_file:
      - .env
    environment:
      - ENVIRONMENT=DEV
      - XDEBUG_MODE=off
    command:
      - php
      - -d
      - xdebug.mode=off
      - -d
      - memory_limit=256M
      - /var/www/denarius.amtgard.com/bin/ledger-worker.php
    networks:
      - amtgard-denarius-shared
      - amtgard-denarius-net

networks:
  amtgard-denarius-shared:
    name: amtgard-denarius-shared
    external: true
  amtgard-denarius-net:
    name: amtgard-denarius-net
    external: true
