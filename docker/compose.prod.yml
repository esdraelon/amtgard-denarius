x-denarius-docker-logging: &denarius-docker-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "3"

services:
  denariusapp:
    logging: *denarius-docker-logging
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    working_dir: /var/www
    volumes:
      - ./.env:/var/www/denarius.amtgard.com/.env:ro
      - ./keys:/var/www/denarius.amtgard.com/keys:ro
      - ${DENARIUS_HEV_WEB_SECRETS:-./.local/empty-secrets}:/run/secrets:ro
      - ${DENARIUS_HEV_CONNECT_SECRETS:-./.local/empty-secrets}:/run/secrets-connect:ro
      - ${HOST_ENV_VAULT_RUNTIME_DIR:-./.local/empty-runtime}:/run/host-env-vault:ro
    env_file:
      - .env
    environment:
      - ENVIRONMENT=PROD
      - APP_DEBUG=false
      - LOG_SPOOL_ENABLED=false
      - LOG_ROOT=/var/www/denarius.amtgard.com/logs/bundles
      - HOST_ENV_SECRETS_DIR=/run/secrets
      - DENARIUS_HEV_CONNECT_SECRETS=/run/secrets-connect
      - HOST_ENV_VAULT_RUNTIME_DIR=/run/host-env-vault
      - DENARIUS_HEV_CONNECT_PROFILE=denarius-connect
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - amtgard-denarius-net
      - amtgard-denarius-shared

networks:
  amtgard-denarius-net:
  amtgard-denarius-shared:
    name: amtgard-denarius-shared
    external: true
