x-denarius-docker-logging: &denarius-docker-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "3"

services:
  ledger-worker:
    logging: *denarius-docker-logging
    image: amtgard-denarius-ledger-worker:latest
    container_name: amtgard-denarius-ledger-worker
    hostname: amtgard-denarius-ledger-worker
    restart: unless-stopped
    stop_grace_period: 15s
    working_dir: /var/www/denarius.amtgard.com
    command: ["php", "-d", "memory_limit=256M", "/var/www/denarius.amtgard.com/bin/ledger-worker.php"]
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/denarius.amtgard.com/.env:ro
      - ./keys:/var/www/denarius.amtgard.com/keys:ro
      - ${DENARIUS_HEV_WORKER_SECRETS:-./.local/empty-secrets}:/run/secrets:ro
      - ${DENARIUS_HOST_LOG_DIR:-/var/log/amtgard-denarius}/worker:/var/www/denarius.amtgard.com/logs
    environment:
      - HOST_ENV_SECRETS_DIR=/run/secrets
      - APP_DEBUG=false
      - LOG_SPOOL_ENABLED=false
      - LOG_ROOT=/var/www/denarius.amtgard.com/logs/bundles
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - amtgard-denarius-shared
      - amtgard-denarius-net

networks:
  amtgard-denarius-shared:
    name: amtgard-denarius-shared
    external: true
  amtgard-denarius-net:
    name: amtgard-denarius-net
    external: true
